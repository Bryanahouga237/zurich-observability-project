version: '3.8'

services:
  # 1. L'application Web (Simulateur d'assurance)
  insurance-app:
    image: bkimminich/juice-shop # On utilise une image existante qui génère des logs et du trafic, ou une fausse API
    container_name: zurich_insurance_app
    ports:
      - "3000:3000"
    networks:
      - monitoring-network

  # 2. Le collecteur de métriques (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: zurich_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring-network

  # 3. La plateforme de visualisation (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: zurich_grafana
    ports:
      - "3100:3000" # Accessible sur le port 3100 pour éviter le conflit avec ton app
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge